<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="t d"><title id="t">Common schematic symbols</title><desc id="d">A chart of sixteen schematic symbols: resistor (zig-zag), variable resistor (zig-zag with an arrow across it), capacitor (two parallel plates), variable capacitor (plates with an arrow across), inductor (a row of loops), transformer (two coils with core lines between them), diode (triangle pointing to a bar; the bar is the cathode), LED (a diode with arrows pointing outward), battery (long and short plates; the long plate is positive), NPN transistor (a circle with base, collector and an emitter arrow pointing out), ground (a line with short diagonal hatch marks, as in the exam figures), antenna, lamp, single-pole single-throw switch, single-pole double-throw switch, and fuse.</desc><g transform="translate(20 20)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H44 "/><path d="M44.0 38.0 L53.3 45.0 L62.7 31.0 L72.0 45.0 L81.3 31.0 L90.7 45.0 L100.0 38.0"/><path d="M100 38 H125"/></g><text x="72" y="84" text-anchor="middle">Resistor</text></g><g transform="translate(175 20)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H44"/><path d="M44.0 38.0 L53.3 45.0 L62.7 31.0 L72.0 45.0 L81.3 31.0 L90.7 45.0 L100.0 38.0"/><path d="M100 38 H125"/><path d="M50 62 L96 14"/></g><path d="M96 14 l-11 2 l7 7z" fill="currentColor"/><text x="72" y="84" text-anchor="middle">Variable resistor</text></g><g transform="translate(330 20)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H64 M64 22 V54 M80 22 V54 M80 38 H125"/></g><text x="72" y="84" text-anchor="middle">Capacitor</text></g><g transform="translate(485 20)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H64 M64 22 V54 M80 22 V54 M80 38 H125 M50 62 L96 14"/></g><path d="M96 14 l-11 2 l7 7z" fill="currentColor"/><text x="72" y="84" text-anchor="middle">Variable capacitor</text></g><g transform="translate(20 125)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 44 H36 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 H125"/></g><text x="72" y="84" text-anchor="middle">Inductor (coil)</text></g><g transform="translate(175 125)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M40 6 V12 a7 7 0 0 1 0 14 a7 7 0 0 1 0 14 a7 7 0 0 1 0 14 V62 M104 6 V12 a7 7 0 0 0 0 14 a7 7 0 0 0 0 14 a7 7 0 0 0 0 14 V62 M66 8 V60 M78 8 V60"/></g><text x="72" y="84" text-anchor="middle">Transformer</text></g><g transform="translate(330 125)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H60 M84 38 H125 M84 24 V52"/></g><path d="M60 24 V52 L84 38z" fill="currentColor"/><text x="54" y="18" class="mu" text-anchor="middle" style="font-size:11px">anode</text><text x="92" y="18" class="mu" style="font-size:11px">cathode</text><text x="72" y="84" text-anchor="middle">Diode</text></g><g transform="translate(485 125)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H60 M84 38 H125 M84 24 V52 M88 22 l10 -10 M96 28 l10 -10"/></g><path d="M60 24 V52 L84 38z" fill="currentColor"/><path d="M98 12 l-6 1 l5 5z M106 18 l-6 1 l5 5z" fill="currentColor"/><text x="72" y="84" text-anchor="middle">LED</text></g><g transform="translate(20 230)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 38 H60 M60 22 V54 M70 30 V46 M80 22 V54 M90 30 V46 M90 38 H125" stroke-width="2.5"/></g><text x="56" y="18" style="font-size:12px">+</text><text x="72" y="84" text-anchor="middle">Battery</text></g><g transform="translate(175 230)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="80" cy="38" r="24"/><path d="M30 38 H70 M70 24 V52 M70 30 L92 18 V10 M70 46 L92 58 V66"/></g><path d="M92 58 l-10 -1 l4 -7z" fill="currentColor"/><text x="72" y="84" text-anchor="middle">Transistor (NPN)</text></g><g transform="translate(330 230)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M72 12 V40 M52 40 H92 M58 40 l-8 14 M72 40 l-8 14 M86 40 l-8 14"/></g><text x="72" y="84" text-anchor="middle">Ground</text></g><g transform="translate(485 230)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M72 64 V20 M50 14 L72 40 L94 14 Z"/></g><text x="72" y="84" text-anchor="middle">Antenna</text></g><g transform="translate(20 335)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 50 H56 M88 50 H125 M56 50 V40 a16 16 0 0 1 32 0 V50"/><path d="M62 50 V44 a10 10 0 0 1 20 0 V50"/></g><text x="72" y="84" text-anchor="middle">Lamp</text></g><g transform="translate(175 335)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 44 H52 M92 44 H125 M58 44 L90 26"/><circle cx="55" cy="44" r="3"/><circle cx="92" cy="44" r="3"/></g><text x="72" y="84" text-anchor="middle">Switch (SPST)</text></g><g transform="translate(330 335)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M20 44 H52 M58 44 L90 28 M95 26 H125 M95 62 H125"/><circle cx="55" cy="44" r="3"/><circle cx="92" cy="26" r="3"/><circle cx="92" cy="62" r="3"/></g><text x="72" y="84" text-anchor="middle">Switch (SPDT)</text></g><g transform="translate(485 335)"><rect width="145" height="95" rx="8" fill="none" stroke="currentColor" class="mu" opacity="0.5"/><g fill="none" stroke="currentColor" stroke-width="2"><rect x="44" y="30" width="56" height="16" rx="3"/><path d="M20 38 H125"/></g><text x="72" y="84" text-anchor="middle">Fuse</text></g></svg>