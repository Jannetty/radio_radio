<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t d"><title id="t">How to connect a voltmeter and an ammeter</title><desc id="d">Left: a voltmeter connected in parallel, across the resistor, measures the voltage across it. Right: an ammeter connected in series, so the circuit current flows through it, measures the current. Measure resistance only with the power off.</desc><g fill="none" stroke="currentColor" stroke-width="2"><path d="M60 50 V100 M60 124 V190 H240 V150 M240 90 V50 H60"/><path d="M240.0 90.0 L250.0 97.0 L260.0 83.0 L270.0 97.0 L280.0 83.0 L290.0 97.0 L300.0 90.0" transform="rotate(90 240 90) translate(0 0)"/><path d="M240 70 H300 V100 M300 140 V170 H240"/><circle cx="300" cy="120" r="20"/><path d="M380 50 V100 M380 124 V190 H580 V150 M580 90 V50 H520 M460 50 H380"/><circle cx="490" cy="50" r="20"/><path d="M470 50 H460 M510 50 H520"/><path d="M580.0 90.0 L590.0 97.0 L600.0 83.0 L610.0 97.0 L620.0 83.0 L630.0 97.0 L640.0 90.0" transform="rotate(90 580 90)"/></g><path d="M44 100 H76 M52 108 H68 M44 116 H76 M52 124 H68" stroke="currentColor" stroke-width="2.5"/><path d="M364 100 H396 M372 108 H388 M364 116 H396 M372 124 H388" stroke="currentColor" stroke-width="2.5"/><g class="ac"><text x="300" y="125" text-anchor="middle" style="font-weight:600">V</text><text x="150" y="20" text-anchor="middle" style="font-weight:600">Voltmeter: in parallel (across)</text></g><g class="ac2"><text x="490" y="55" text-anchor="middle" style="font-weight:600">A</text><text x="480" y="20" text-anchor="middle" style="font-weight:600">Ammeter: in series (in the loop)</text></g><text x="320" y="220" text-anchor="middle" class="mu">Ohmmeter: power off, and measure across the part</text></svg>