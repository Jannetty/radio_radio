<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t d"><title id="t">Ohm's law and the power formula</title><desc id="d">Two memory circles. Ohm's law: E at the top, I and R at the bottom. Cover the quantity you want: E equals I times R, I equals E divided by R, R equals E divided by I. Power: P at the top, I and E at the bottom: P equals I times E, I equals P divided by E, E equals P divided by I.</desc><g class="ac" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="160" cy="95" r="70"/><path d="M94 102 H226 M160 102 V163"/></g><g class="ac"><text x="160" y="80" text-anchor="middle" style="font-size:30px;font-weight:600">E</text><text x="130" y="142" text-anchor="middle" style="font-size:26px;font-weight:600">I</text><text x="190" y="142" text-anchor="middle" style="font-size:26px;font-weight:600">R</text></g><text x="160" y="16" text-anchor="middle" font-weight="600">Ohm's law</text><g class="ac2" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="480" cy="95" r="70"/><path d="M414 102 H546 M480 102 V163"/></g><g class="ac2"><text x="480" y="80" text-anchor="middle" style="font-size:30px;font-weight:600">P</text><text x="450" y="142" text-anchor="middle" style="font-size:26px;font-weight:600">I</text><text x="510" y="142" text-anchor="middle" style="font-size:26px;font-weight:600">E</text></g><text x="480" y="16" text-anchor="middle" font-weight="600">Power</text><text x="160" y="190" text-anchor="middle">E = I × R  ·  I = E ÷ R  ·  R = E ÷ I</text><text x="160" y="210" text-anchor="middle" class="mu">volts, amperes, ohms</text><text x="480" y="190" text-anchor="middle">P = I × E  ·  I = P ÷ E  ·  E = P ÷ I</text><text x="480" y="210" text-anchor="middle" class="mu">watts, amperes, volts</text></svg>