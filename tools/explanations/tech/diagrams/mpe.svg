<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">FCC exposure limits for the general public versus frequency</title><desc id="d">A log-log graph of the FCC maximum permissible exposure for the general population, in milliwatts per square centimeter, from 1 to 100,000 megahertz. The limit is 100 below 1.34 megahertz, falls as 180 divided by frequency squared up to 30 megahertz, is lowest at 0.2 from 30 to 300 megahertz, rises as frequency divided by 1500 up to 1500 megahertz, and is 1.0 above that. Marked points: 3.5 megahertz about 14.7, 50 megahertz 0.2, 440 megahertz about 0.29, 1296 megahertz about 0.86.</desc><g class="mu" stroke="currentColor" fill="none"><path d="M80 30 V240 H610"/></g><g class="mu"><path d="M80.0 240 V245" stroke="currentColor"/><text x="80.0" y="260" text-anchor="middle">1</text></g><g class="mu"><path d="M186.0 240 V245" stroke="currentColor"/><text x="186.0" y="260" text-anchor="middle">10</text></g><g class="mu"><path d="M292.0 240 V245" stroke="currentColor"/><text x="292.0" y="260" text-anchor="middle">100</text></g><g class="mu"><path d="M398.0 240 V245" stroke="currentColor"/><text x="398.0" y="260" text-anchor="middle">1000</text></g><g class="mu"><path d="M504.0 240 V245" stroke="currentColor"/><text x="504.0" y="260" text-anchor="middle">10,000</text></g><g class="mu"><path d="M610.0 240 V245" stroke="currentColor"/><text x="610.0" y="260" text-anchor="middle">100,000</text></g><g class="mu"><path d="M75 240.0 H80" stroke="currentColor"/><text x="72" y="244.0" text-anchor="end">0.1</text></g><g class="mu"><path d="M75 176.4 H80" stroke="currentColor"/><text x="72" y="180.4" text-anchor="end">1</text></g><g class="mu"><path d="M75 112.8 H80" stroke="currentColor"/><text x="72" y="116.8" text-anchor="end">10</text></g><g class="mu"><path d="M75 49.2 H80" stroke="currentColor"/><text x="72" y="53.2" text-anchor="end">100</text></g><text x="345.0" y="282" text-anchor="middle" 