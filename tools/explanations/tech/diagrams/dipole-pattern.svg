<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d"><title id="t">Radiation pattern of a half-wave dipole</title><desc id="d">Seen from above, a horizontal half-wave dipole wire runs left to right through the center. Its radiation pattern is a figure eight: strongest broadside, at right angles to the wire, and much less off the ends of the wire. This is the free-space pattern.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g class="ac"><path d="M200.0 130.0 L202.9 129.9 L205.7 129.6 L208.6 129.1 L211.4 128.4 L214.2 127.5 L217.0 126.4 L219.6 125.1 L222.3 123.6 L224.8 121.9 L227.3 120.1 L229.7 118.0 L231.9 115.8 L234.1 113.4 L236.1 110.8 L238.0 108.1 L239.7 105.2 L241.3 102.1 L242.7 99.0 L243.9 95.7 L245.0 92.3 L245.8 88.8 L246.4 85.2 L246.8 81.5 L247.0 77.9 L246.9 74.1 L246.6 70.4 L246.0 66.7 L245.2 63.0 L244.2 59.3 L242.9 55.8 L241.3 52.3 L239.5 48.9 L237.5 45.7 L235.3 42.7 L232.8 39.8 L230.2 37.1 L227.3 34.7 L224.3 32.5 L221.1 30.6 L217.8 28.9 L214.4 27.5 L210.9 26.4 L207.3 25.6 L203.7 25.2 L200.0 25.0 L196.3 25.2 L192.7 25.6 L189.1 26.4 L185.6 27.5 L182.2 28.9 L178.9 30.6 L175.7 32.5 L172.7 34.7 L169.8 37.1 L167.2 39.8 L164.7 42.7 L162.5 45.7 L160.5 48.9 L158.7 52.3 L157.1 55.8 L155.8 59.3 L154.8 63.0 L154.0 66.7 L153.4 70.4 L153.1 74.1 L153.0 77.9 L153.2 81.5 L153.6 85.2 L154.2 88.8 L155.0 92.3 L156.1 95.7 L157.3 99.0 L158.7 102.1 L160.3 105.2 L162.0 108.1 L163.9 110.8 L165.9 113.4 L168.1 115.8 L170.3 118.0 L172.7 120.1 L175.2 121.9 L177.7 123.6 L180.4 125.1 L183.0 126.4 L185.8 127.5 L188.6 128.4 L191.4 129.1 L194.3 129.6 L197.1 129.9 L200.0 130.0 L197.1 130.1 L194.3 130.4 L191.4 130.9 L188.6 131.6 L185.8 132.5 L183.0 133.6 L180.4 134.9 L177.7 136.4 L175.2 138.1 L172.7 139.9 L170.3 142.0 L168.1 144.2 L165.9 146.6 L163.9 149.2 L162.0 151.9 L160.3 154.8 L158.7 157.9 L157.3 161.0 L1