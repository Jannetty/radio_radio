<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="t d"><title id="t">Typical bandwidths of common modes</title><desc id="d">A bar chart on a logarithmic scale. CW is about 150 hertz wide, SSB voice about 3 kilohertz, FM voice about 10 to 15 kilohertz, and AM fast-scan television about 6 megahertz.</desc><text x="140" y="47" text-anchor="end">CW</text><g class="ac"><rect x="150" y="30" width="40.5" height="24" rx="3" fill="currentColor" opacity="0.75"/></g><text x="198.5" y="47" >about 150 Hz</text><text x="140" y="87" text-anchor="end">SSB voice</text><g class="ac"><rect x="150" y="70" width="150.9" height="24" rx="3" fill="currentColor" opacity="0.75"/></g><text x="308.9" y="87" >about 3 kHz</text><text x="140" y="127" text-anchor="end">FM voice</text><g class="ac"><rect x="150" y="110" width="210.3" height="24" rx="3" fill="currentColor" opacity="0.75"/></g><text x="368.3" y="127" >about 10–15 kHz</text><text x="140" y="167" text-anchor="end">Fast-scan TV</text><g class="ac"><rect x="150" y="150" width="431.2" height="24" rx="3" fill="currentColor" opacity="0.75"/></g><text x="573.2" y="167" text-anchor="end" style="fill:var(--bg)">about 6 MHz</text><g class="mu"><path d="M175.6 192 V198" stroke="currentColor"/><text x="175.6" y="214" text-anchor="middle">100 Hz</text></g><g class="mu"><path d="M260.4 192 V198" stroke="currentColor"/><text x="260.4" y="214" text-anchor="middle">1 kHz</text></g><g class="mu"><path d="M345.3 192 V198" stroke="currentColor"/><text x="345.3" y="214" text-anchor="middle">10 kHz</text></g><g class="mu"><path d="M430.2 192 V198" stroke="currentColor"/><text x="430.2" y="214" text-anchor="middle">100 kHz</text></g><g class="mu"><path d="M515.1 192 V198" stroke="currentColor"/><text x="515.1" y="214" text-anchor="middle">1 MHz</text></g><g class="mu"><path d="M600.0 192 V198" stroke="currentColor"/><text x="600.0" y="214" text-anchor="middle">10 MHz</text></g><g class="mu"><path d="M150 192 H600" stroke="currentColor"/></g></svg>