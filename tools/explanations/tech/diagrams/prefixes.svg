<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="t d"><title id="t">Metric prefixes used in radio</title><desc id="d">A ladder of prefixes from pico to giga. Each step is a factor of 1000: pico 10 to the minus 12, nano 10 to the minus 9, micro 10 to the minus 6, milli 10 to the minus 3, the base unit, kilo 10 cubed, mega 10 to the 6th, giga 10 to the 9th. Moving one step to the right divides the number by 1000; one step to the left multiplies it by 1000. Example: 1,500,000 hertz is 1500 kilohertz or 1.5 megahertz.</desc><g class="ac"><rect x="30" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="63.0" y="54" text-anchor="middle" font-weight="600">pico</text><text x="63.0" y="72" text-anchor="middle">p</text><text x="63.0" y="88" text-anchor="middle" class="mu">10⁻¹²</text><g class="ac"><rect x="104" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="137.0" y="54" text-anchor="middle" font-weight="600">nano</text><text x="137.0" y="72" text-anchor="middle">n</text><text x="137.0" y="88" text-anchor="middle" class="mu">10⁻⁹</text><g class="ac"><rect x="178" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="211.0" y="54" text-anchor="middle" font-weight="600">micro</text><text x="211.0" y="72" text-anchor="middle">µ</text><text x="211.0" y="88" text-anchor="middle" class="mu">10⁻⁶</text><g class="ac"><rect x="252" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="285.0" y="54" text-anchor="middle" font-weight="600">milli</text><text x="285.0" y="72" text-anchor="middle">m</text><text x="285.0" y="88" text-anchor="middle" class="mu">10⁻³</text><g class="ac2"><rect x="326" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="359.0" y="54" text-anchor="middle" font-weight="600">base</text><text x="359.0" y="72" text-anchor="middle">V, A, Hz</text><text x="359.0" y="88" text-anchor="middle" class="mu">1</text><g class="ac"><rect x="400" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="433.0" y="54" text-anchor="middle" font-weight="600">kilo</text><text x="433.0" y="72" text-anchor="middle">k</text><text x="433.0" y="88" text-anchor="middle" class="mu">10³</text><g class="ac"><rect x="474" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="507.0" y="54" text-anchor="middle" font-weight="600">mega</text><text x="507.0" y="72" text-anchor="middle">M</text><text x="507.0" y="88" text-anchor="middle" class="mu">10⁶</text><g class="ac"><rect x="548" y="30" width="66" height="64" rx="6" fill="currentColor" opacity="0.12" stroke="currentColor"/></g><text x="581.0" y="54" text-anchor="middle" font-weight="600">giga</text><text x="581.0" y="72" text-anchor="middle">G</text><text x="581.0" y="88" text-anchor="middle" class="mu">10⁹</text><text x="320" y="18" text-anchor="middle" class="mu">each step = × 1000</text><text x="320" y="124" text-anchor="middle">Bigger prefix → smaller number: 1,500,000 Hz = 1500 kHz = 1.5 MHz</text><text x="320" y="148" text-anchor="middle">Smaller prefix → bigger number: 1.5 A = 1500 mA;  1 µF = 1,000,000 pF</text></svg>