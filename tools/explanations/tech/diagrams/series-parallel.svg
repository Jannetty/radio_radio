<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d"><title id="t">Series and parallel circuits</title><desc id="d">Left: a series circuit, a battery and two resistors in one loop, so the same current flows through every part and the battery's voltage is shared between the resistors. Right: a parallel circuit, two resistors each connected directly across the battery, so each has the same voltage across it and the battery's current is shared between the branches.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><text x="160" y="20" text-anchor="middle" font-weight="600">Series</text><text x="480" y="20" text-anchor="middle" font-weight="600">Parallel</text><g fill="none" stroke="currentColor" stroke-width="2"><path d="M60 50 V108 M60 132 V190 H260 V150 M260 90 V50 H190 M130 50 H60"/><path d="M130.0 50.0 L140.0 58.0 L150.0 42.0 L160.0 58.0 L170.0 42.0 L180.0 58.0 L190.0 50.0"/><path d="M260.0 90.0 L268.0 100.0 L252.0 110.0 L268.0 120.0 L252.0 130.0 L268.0 140.0 L260.0 150.0" transform="translate(0 0)"/></g><path d="M44 108 H76 M52 116 H68 M44 124 H76 M52 132 H68" stroke="currentColor" stroke-width="2.5"/><g class="ac"><text x="160" y="222" text-anchor="middle">same current everywhere</text></g><g fill="none" stroke="currentColor" stroke-width="2"><path d="M380 50 V108 M380 132 V190 H580 V150 M580 90 V50 H380 M480 50 V90 M480 150 V190"/><path d="M480.0 90.0 L488.0 100.0 L472.0 110.0 L488.0 120.0 L472.0 130.0 L488.0 140.0 L480.0 150.0"/><path d="M580.0 90.0 L588.0 100.0 L572.0 110.0 L588.0 120.0 L572.0 130.0 L588.0 140.0 L580.0 150.0"/></g><path d="M364 108 H396 M372 116 H388 M364 124 H396 M372 132 H388" stroke="currentColor" stroke-width="2.5"/><g class="ac2"><text x="480" y="222" text-anchor="middle">same voltage across each branch</text></g><text x="40" y="113" text-anchor="end" style="font-size:13px">+</text><text x="360" y="113" text-anchor="end" style="font-size:13px">+</text></svg>