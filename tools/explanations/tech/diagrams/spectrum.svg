<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d"><title id="t">HF, VHF and UHF, with amateur bands and wavelengths</title><desc id="d">A logarithmic frequency scale from 3 MHz to 3000 MHz. HF is 3 to 30 MHz, VHF 30 to 300 MHz and UHF 300 to 3000 MHz. Wavelength runs from 100 meters at 3 MHz to 10 meters at 30 MHz, 1 meter at 300 MHz and 10 centimeters at 3000 MHz. Marked amateur bands: 10 meters at 28 to 29.7 MHz, 6 meters at 50 to 54, 2 meters at 144 to 148, 1.25 meters at 222 to 225, 70 centimeters at 420 to 450 and 23 centimeters at 1240 to 1300 MHz.</desc><g class="ac2"><rect x="40.0" y="40" width="186.7" height="44" fill="currentColor" opacity="0.15" stroke="currentColor"/><text x="133.3" y="60" text-anchor="middle" font-weight="600">HF</text><text x="133.3" y="77" text-anchor="middle">3–30 MHz</text></g><g class="ac"><rect x="226.7" y="40" width="186.7" height="44" fill="currentColor" opacity="0.15" stroke="currentColor"/><text x="320.0" y="60" text-anchor="middle" font-weight="600">VHF</text><text x="320.0" y="77" text-anchor="middle">30–300 MHz</text></g><g class="ac3"><rect x="413.3" y="40" width="186.7" height="44" fill="currentColor" opacity="0.15" stroke="currentColor"/><text x="506.7" y="60" text-anchor="middle" font-weight="600">UHF</text><text x="506.7" y="77" text-anchor="middle">300–3000 MHz</text></g><g stroke="currentColor"><path d="M40.0 84 V100"/></g><text x="40.0" y="114" text-anchor="middle">3 MHz</text><g class="mu"><text x="40.0" y="230" text-anchor="middle">λ ≈ 100 m</text></g><g stroke="currentColor"><path d="M226.7 84 V100"/></g><text x="226.7" y="114" text-anchor="middle">30 MHz</text><g class="mu"><text x="226.7" y="230" text-anchor="middle">λ ≈ 10 m</text></g><g stroke="currentColor"><path d="M413.3 84 V100"/></g><text x="413.3" y="114" text-anchor="middle">300 MHz</text><g class="mu"><text x="413.3" y="230" text-anchor="middle">λ ≈ 1 m</text></g><g stroke="currentColor"><path d="M600.0 84 V100"/></g><text x="600.0" y="114" text-anchor="middle">3000 MHz</text><g class="mu"><text x="600.0" y="230" text-anchor="middle">λ ≈ 10 cm</text></g><g class="mu"><text x="320.0" y="24" text-anchor="middle">Frequency (log scale) — higher frequency, shorter wavelength</text></g><g class="ac"><rect x="221.1" y="124" width="4.8" height="10" fill="currentColor"/><path d="M223.5 134 V144" stroke="currentColor"/></g><text x="223.5" y="158" text-anchor="middle">10 m</text><g class="ac"><rect x="268.1" y="124" width="6.2" height="10" fill="currentColor"/><path d="M271.2 134 V180" stroke="currentColor"/></g><text x="271.2" y="194" text-anchor="middle">6 m</text><g class="ac"><rect x="353.8" y="124" width="3.0" height="10" fill="currentColor"/><path d="M354.9 134 V144" stroke="currentColor"/></g><text x="354.9" y="158" text-anchor="middle">2 m</text><g class="ac"><rect x="388.9" y="124" width="3.0" height="10" fill="currentColor"/><path d="M389.5 134 V180" stroke="currentColor"/></g><text x="389.5" y="194" text-anchor="middle">1.25 m</text><g class="ac"><rect x="440.6" y="124" width="5.6" height="10" fill="currentColor"/><path d="M443.4 134 V144" stroke="currentColor"/></g><text x="443.4" y="158" text-anchor="middle">70 cm</text><g class="ac"><rect x="528.4" y="124" width="3.8" height="10" fill="currentColor"/><path d="M530.3 134 V180" stroke="currentColor"/></g><text x="530.3" y="194" text-anchor="middle">23 cm</text><g class="mu"><path d="M40 210 H600" stroke="currentColor"/></g></svg>