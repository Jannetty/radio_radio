<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d"><title id="t">Multipath: direct and reflected signals combine</title><desc id="d">A transmitter on the left and a receiver on the right. One signal travels directly; another bounces off the ground (or a building) and travels a longer path. Where the two arrive in step (in phase) they add to make a stronger signal; where they arrive in opposite steps (out of phase) they cancel and the signal fades. Moving the receiving antenna a short distance changes which happens.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g stroke="currentColor" fill="none" stroke-width="2"><path d="M40 180 H600"/><path d="M80 180 V60"/><path d="M560 180 V80"/></g><text x="80" y="200" text-anchor="middle">Transmitter</text><text x="560" y="200" text-anchor="middle">Receiver</text><g class="ac" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M84 64 L552 84" marker-end="url(#ah)"/></g><g class="ac"><text x="320" y="62" text-anchor="middle">direct path</text></g><g class="ac2" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M84 66 L338 178" marker-end="url(#ah)"/><path d="M340 178 L552 88" marker-end="url(#ah)"/></g><g class="ac2"><text x="340" y="145" text-anchor="middle">reflected path (longer)</text></g><g fill="none" stroke-width="2"><path class="ac" stroke="currentColor" d="M40.0 235.0 L42.0 231.5 L44.0 228.4 L46.0 226.2 L48.0 225.1 L50.0 225.3 L52.0 226.7 L54.0 229.1 L56.0 232.3 L58.0 235.9 L60.0 239.3 L62.0 242.2 L64.0 244.2 L66.0 245.0 L68.0 244.5 L70.0 242.8 L72.0 240.1 L74.0 236.8 L76.0 233.2 L78.0 229.9 L80.0 227.2 L82.0 225.5 L84.0 225.0 L86.0 225.8 L88.0 227.8 L90.0 230.7 L92.0 234.1 L94.0 237.7 L96.0 240.9 L98.0 243.3 L100.0 244.7 L102.0 244.9 L104.0 243.8 L106.0 241.6 L108.0 238.5 L110.0 235.0"/><path class="ac2" stroke