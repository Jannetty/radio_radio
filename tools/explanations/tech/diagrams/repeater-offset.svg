<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d"><title id="t">How a repeater uses an input and an output frequency</title><desc id="d">Station A transmits on the repeater input, 146.34 MHz. The repeater, on a hilltop, retransmits on its output, 146.94 MHz, which stations A and B both receive. The two frequencies are 600 kilohertz apart: the offset.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g class="mu" fill="none" stroke="currentColor" stroke-width="2"><path d="M230 200 L320 60 L410 200"/></g>
<g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M320 60 V25"/><path d="M308 60 L320 25 L332 60"/></g>
<text x="320" y="16" text-anchor="middle">Repeater</text>
<g fill="none" stroke="currentColor" stroke-width="2"><rect x="40" y="170" width="26" height="44" rx="4"/><path d="M53 170 V140"/><rect x="574" y="170" width="26" height="44" rx="4"/><path d="M587 170 V140"/></g>
<text x="53" y="236" text-anchor="middle">Station A</text><text x="587" y="236" text-anchor="middle">Station B</text>
<g class="ac" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M72 150 Q170 60 296 42" marker-end="url(#ah)"/></g>
<g class="ac" ><text x="40" y="60">Input: 146.34 MHz</text><text x="40" y="78" class="mu">(A transmits here)</text></g>
<g class="ac3" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M344 42 Q470 60 568 150" marker-end="url(#ah)"/><path d="M300 56 Q200 130 80 168" marker-end="url(#ah)"/></g>
<g class="ac3"><text x="385" y="128">Output: 146.94 MHz</text><text x="385" y="146" class="mu">(everyone listens here)</text></g>
<text x="320" y="252" text-anchor="middle">Offset = 146.94 − 146.34 = 0.60 MHz (600 kHz), typical on 2 meters</text>
</svg>
