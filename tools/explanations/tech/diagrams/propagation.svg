<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d"><title id="t">How radio signals travel: line of sight, sky wave and sporadic E</title><desc id="d">Not to scale. The Earth's curved surface with the lower atmosphere (troposphere) and, far above, the ionosphere's E and F regions. A VHF or UHF signal travels in a straight line to the radio horizon and passes through the ionosphere into space. An HF signal is bent back down by the F region and lands far away, skipping over the area between. A patch of sporadic E in the E region can reflect VHF signals that would normally pass through.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g stroke-width="2"><path class="" d="M0 252.6 A1000 1000 0 0 1 640 252.6" fill="none" stroke="currentColor" stroke-width="2.5"/><path class="mu" d="M0 215.7 A1035 1035 0 0 1 640 215.7" fill="none" stroke="currentColor" stroke-dasharray="4 4"/></g><g class="mu" fill="currentColor" opacity="0.12"><path d="M0 95.4 A1150 1150 0 0 1 640 95.4 L640 53.8 A1190 1190 0 0 0 0 53.8 Z"/></g><g class="mu" fill="currentColor" opacity="0.22"><path d="M0 147.6 A1100 1100 0 0 1 640 147.6 L640 131.9 A1115 1115 0 0 0 0 131.9 Z"/></g><text x="630" y="74" text-anchor="end">F region (ionosphere)</text><text x="630" y="133" text-anchor="end">E region</text><text x="12" y="186" class="mu">troposphere</text><g stroke="currentColor" stroke-width="2"><path d="M110 222.3 V206.3"/></g><g class="ac2" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M110 206.3 Q300 -110 500 214.3" marker-end="url(#ah)"/></g><g class="ac2"><text x="330" y="150" text-anchor="middle">HF sky wave (skip)</text></g><g class="ac" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M110 206.3 L190 10" marker-end="url(#ah)"/></g><g class="ac"><text x="196" y="24">VHF/UHF passes through to space</text></g><g class="ac3" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M110 206.3 L270 195.3" marker-end="url(#ah)"/></g><g class="ac3"><text x="200" y="223.3">line of sight to radio horizon</text></g><g class="ac" fill="currentColor" opacity="0.35"><ellipse cx="500" cy="108" rx="40" ry="7"/></g><text x="545" y="154" text-anchor="middle" class="mu">sporadic E patch</text></svg>