<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="t d"><title id="t">The usable frequency window between the LUF and the MUF</title><desc id="d">A frequency scale for one path at one time, rising from left to right. Below the lowest usable frequency (LUF) signals are absorbed, mostly in the D region, and are too weak to be heard. Between the LUF and the maximum usable frequency (MUF) the ionosphere refracts signals back to Earth, so the path works. Above the MUF signals pass through the ionosphere and are lost in space. The strongest signals, with the least absorption, are just below the MUF. If the LUF rises above the MUF there is no usable window.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g class="mu"><rect x="40" y="90" width="130" height="44" fill="currentColor" opacity="0.18"/></g><g class="ac"><rect x="170" y="90" width="300" height="44" fill="currentColor" opacity="0.35"/></g><g class="ac3"><rect x="470" y="90" width="130" height="44" fill="currentColor" opacity="0.18"/></g><rect x="40" y="90" width="560" height="44" fill="none" stroke="currentColor"/><path d="M170 76 V142" stroke="currentColor" stroke-width="2.5"/><text x="170" y="70" text-anchor="middle" style="font-weight:600">LUF</text><path d="M470 76 V142" stroke="currentColor" stroke-width="2.5"/><text x="470" y="70" text-anchor="middle" style="font-weight:600">MUF</text><text x="105.0" y="110" text-anchor="middle">absorbed</text><text x="105.0" y="126" text-anchor="middle" class="mu" style="font-size:12px">(mostly D region)</text><text x="320.0" y="110" text-anchor="middle">refracted back to Earth</text><text x="320.0" y="126" text-anchor="middle" style="font-size:12px">the path works</text><text x="535.0" y="110" text-anchor="middle">passes through</text><text x="535.0" y="126" text-anchor="middle" class="mu" style="font-size:12px">lost in space</text><g class="ac2"><path d="M410 174 L458 140" stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="406" y="188" text-anchor="end">least loss: just below the MUF</text></g><path d="M40 204 H600" stroke="currentColor" marker-end="url(#ah)"/><text x="600" y="194" text-anchor="end" class="mu" style="font-size:12px">frequency</text></svg>