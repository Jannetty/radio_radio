<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 504" role="img" aria-labelledby="t d"><title id="t">General class HF privileges, ITU Region 2</title><desc id="d">For each HF band, the bar shows the whole band, with the parts a General class operator may use shaded, and the phone segment marked with a line underneath. 160 m: all of 1.800 to 2.000 MHz. 80 and 75 m: 3.525 to 3.600 and 3.800 to 4.000 MHz. 60 m (not shown): the four channels and 5.3515 to 5.3665 MHz. 40 m: 7.025 to 7.125 and 7.175 to 7.300 MHz. 30 m: all, CW and data only. 20 m: 14.025 to 14.150 and 14.225 to 14.350 MHz. 17 m: all. 15 m: 21.025 to 21.200 and 21.275 to 21.450 MHz. 12 m: all. 10 m: all. The unshaded gaps on 80, 40, 20 and 15 m are for Amateur Extra (and some Advanced) licensees.</desc><g class="ac"><rect x="90" y="10" width="22" height="12" fill="currentColor" opacity="0.55"/></g><text x="120" y="21">General may transmit</text><g class="ac2"><path d="M300 16 H330" stroke="currentColor" stroke-width="3"/></g><text x="338" y="21">phone segment</text><g class="mu"><text x="90" y="44">Each bar is one whole band (bands are not to a common scale).</text></g><text x="80" y="75" text-anchor="end" style="font-weight:600">160 m</text><rect x="90" y="60" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="90.0" y="60" width="520.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M90.0 84 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="99" style="font-size:11px">1.800</text><text x="610" y="99" text-anchor="end" style="font-size:11px">2.000 MHz</text></g><text x="80" y="121" text-anchor="end" style="font-weight:600">80/75 m</text><rect x="90" y="106" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="116.0" y="106" width="78.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac"><rect x="402.0" y="106" width="208.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M194.0 130 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="145" style="font-size:11px">3.500</text><text x="610" y="145" text-anchor="end" style="font-size:11px">4.000 MHz</text></g><text x="155.0" y="120" text-anchor="middle" style="font-size:11px">3.525–3.600</text><text x="506.0" y="120" text-anchor="middle" style="font-size:11px">3.800–4.000</text><text x="80" y="167" text-anchor="end" style="font-weight:600">40 m</text><rect x="90" y="152" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="133.3" y="152" width="173.3" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac"><rect x="393.3" y="152" width="216.7" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M306.7 176 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="191" style="font-size:11px">7.000</text><text x="610" y="191" text-anchor="end" style="font-size:11px">7.300 MHz</text></g><text x="220.0" y="166" text-anchor="middle" style="font-size:11px">7.025–7.125</text><text x="501.7" y="166" text-anchor="middle" style="font-size:11px">7.175–7.300</text><text x="80" y="213" text-anchor="end" style="font-weight:600">30 m</text><rect x="90" y="198" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="90.0" y="198" width="520.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="mu"><text x="90" y="237" style="font-size:11px">10.100</text><text x="610" y="237" text-anchor="end" style="font-size:11px">10.150 MHz</text></g><text x="80" y="259" text-anchor="end" style="font-weight:600">20 m</text><rect x="90" y="244" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="127.1" y="244" width="185.7" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac"><rect x="424.3" y="244" width="185.7" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M312.9 268 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="283" style="font-size:11px">14.000</text><text x="610" y="283" text-anchor="end" style="font-size:11px">14.350 MHz</text></g><text x="220.0" y="258" text-anchor="middle" style="font-size:11px">14.025–14.150</text><text x="517.1" y="258" text-anchor="middle" style="font-size:11px">14.225–14.350</text><text x="80" y="305" text-anchor="end" style="font-weight:600">17 m</text><rect x="90" y="290" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="90.0" y="290" width="520.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M308.4 314 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="329" style="font-size:11px">18.068</text><text x="610" y="329" text-anchor="end" style="font-size:11px">18.168 MHz</text></g><text x="80" y="351" text-anchor="end" style="font-weight:600">15 m</text><rect x="90" y="336" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="118.9" y="336" width="202.2" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac"><rect x="407.8" y="336" width="202.2" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M321.1 360 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="375" style="font-size:11px">21.000</text><text x="610" y="375" text-anchor="end" style="font-size:11px">21.450 MHz</text></g><text x="220.0" y="350" text-anchor="middle" style="font-size:11px">21.025–21.200</text><text x="508.9" y="350" text-anchor="middle" style="font-size:11px">21.275–21.450</text><text x="80" y="397" text-anchor="end" style="font-weight:600">12 m</text><rect x="90" y="382" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="90.0" y="382" width="520.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M298.0 406 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="421" style="font-size:11px">24.890</text><text x="610" y="421" text-anchor="end" style="font-size:11px">24.990 MHz</text></g><text x="80" y="443" text-anchor="end" style="font-weight:600">10 m</text><rect x="90" y="428" width="520" height="20" fill="none" stroke="currentColor" class="mu"/><g class="ac"><rect x="90.0" y="428" width="520.0" height="20" fill="currentColor" opacity="0.55"/></g><g class="ac2"><path d="M181.8 452 H610.0" stroke="currentColor" stroke-width="3"/></g><g class="mu"><text x="90" y="467" style="font-size:11px">28.000</text><text x="610" y="467" text-anchor="end" style="font-size:11px">29.700 MHz</text></g><g class="mu"><text x="90" y="490">60 m: General may use all four channels and 5.3515–5.3665 MHz (not shown).</text></g></svg>